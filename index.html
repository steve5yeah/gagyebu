<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>우리집 가계부</title>
<style>
:root{
  --bg:#f4f4f5; --surface:#ffffff; --surface-2:#fafafa; --surface-3:#f0f0f1;
  --text:#18181b; --text-2:#5c5c66; --text-3:#9b9ba3;
  --line:#e6e6e9; --line-2:#d2d2d7;
  --ink:#18181b; --on-ink:#ffffff;
  --r:14px; --r-sm:9px;
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#0b0b0c; --surface:#151517; --surface-2:#1b1b1e; --surface-3:#232327;
    --text:#f2f2f3; --text-2:#a6a6ae; --text-3:#74747d;
    --line:#26262a; --line-2:#3a3a40;
    --ink:#f2f2f3; --on-ink:#151517;
  }
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0; background:var(--bg); color:var(--text);
  font-family:"Pretendard","Apple SD Gothic Neo","Malgun Gothic",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  font-size:14px; line-height:1.55; -webkit-font-smoothing:antialiased;
  font-variant-numeric:tabular-nums; font-feature-settings:"tnum" 1;
}
button,input,select{font:inherit;color:inherit}
[hidden]{display:none !important}

.wrap{max-width:980px;margin:0 auto;padding:0 16px 96px}

/* ---------- 헤더 ---------- */
header.top{
  position:sticky; top:0; z-index:20; background:var(--bg);
  padding:calc(env(safe-area-inset-top,0px) + 18px) 0 0;
  border-bottom:1px solid var(--line);
}
.brand{display:flex;align-items:baseline;gap:10px;margin-bottom:14px}
.brand h1{font-size:19px;margin:0;letter-spacing:-.02em;font-weight:700}
.brand .tag{font-size:11px;color:var(--text-3);border:1px solid var(--line-2);border-radius:999px;padding:1px 8px}
.tabs{display:flex;gap:2px;overflow:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{
  background:none;border:none;padding:9px 12px 12px;cursor:pointer;
  color:var(--text-3);font-size:14px;font-weight:600;white-space:nowrap;
  border-bottom:2px solid transparent;margin-bottom:-1px;
}
.tabs button.on{color:var(--text);border-bottom-color:var(--ink)}

.monthbar{display:flex;align-items:center;justify-content:center;gap:6px;padding:16px 0 4px}
.monthbar .lbl{font-size:16px;font-weight:700;min-width:118px;text-align:center;letter-spacing:-.01em}
.nav-btn{
  width:30px;height:30px;border-radius:8px;border:1px solid var(--line);
  background:var(--surface);cursor:pointer;color:var(--text-2);line-height:1;
}
.nav-btn:hover{background:var(--surface-3)}
.today-btn{margin-left:6px;font-size:12px;padding:5px 10px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--text-2);cursor:pointer}

/* ---------- 공통 ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.card + .card{margin-top:12px}
.grid{display:grid;gap:12px}
@media(min-width:760px){ .grid.two{grid-template-columns:1fr 1fr;align-items:start} }
.card h2{font-size:13px;margin:0 0 2px;font-weight:700;letter-spacing:-.01em}
.card .hint{font-size:11.5px;color:var(--text-3);margin:0 0 14px;line-height:1.6}
.sec-head{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.muted{color:var(--text-3)}
.u{font-size:.78em;color:var(--text-3);margin-left:1px;font-weight:500}
.rowline{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
.rowline:last-child{border-bottom:none}
.rowline .k{color:var(--text-2);font-size:13px}
.rowline .v{font-weight:600}
.note{font-size:11.5px;color:var(--text-3);line-height:1.7;margin-top:12px;padding-top:12px;border-top:1px dashed var(--line)}
.empty{text-align:center;color:var(--text-3);padding:36px 12px;font-size:13px}

.bar{position:relative;height:7px;background:var(--surface-3);border-radius:999px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--ink);border-radius:999px}
.bar>i.soft{background:var(--text-3)}
.bar>i.over{background-image:repeating-linear-gradient(45deg,rgba(128,128,128,.6) 0 3px,transparent 3px 6px)}
.bar .mark{position:absolute;top:-2px;bottom:-2px;width:1px;background:var(--line-2)}

.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.stats .s{background:var(--surface);padding:14px 14px 15px}
.stats .s .k{font-size:11.5px;color:var(--text-3);margin-bottom:5px}
.stats .s .v{font-size:17px;font-weight:700;letter-spacing:-.02em}
.stats .s.dim .v{color:var(--text-2)}
@media(max-width:700px){ .stats{grid-template-columns:1fr 1fr} }

.pill{display:inline-block;font-size:11px;padding:1px 7px;border-radius:999px;font-weight:600;white-space:nowrap}
.pill.income{border:1px solid var(--line-2);color:var(--text-2)}
.pill.expense{background:var(--ink);color:var(--on-ink)}
.pill.saving{background:var(--surface-3);color:var(--text-2);border:1px solid var(--line)}
.pill.flat{background:var(--surface-3);color:var(--text-2)}

.btn{border:1px solid var(--line-2);background:var(--surface);border-radius:var(--r-sm);padding:9px 14px;font-size:13px;font-weight:600;cursor:pointer}
.btn:hover{background:var(--surface-3)}
.btn.primary{background:var(--ink);color:var(--on-ink);border-color:var(--ink);width:100%;padding:11px;font-size:14px}
.btn.primary:hover{opacity:.88;background:var(--ink)}
.btn.sm{padding:5px 10px;font-size:12px}
.btn.ghost{border-color:transparent;background:none;color:var(--text-3)}
.btn.ghost:hover{background:var(--surface-3);color:var(--text)}

input[type=text],input[type=date],input[type=number],select{
  width:100%;padding:9px 10px;border:1px solid var(--line-2);border-radius:var(--r-sm);
  background:var(--surface-2);outline:none;
}
input:focus,select:focus{border-color:var(--text-3);background:var(--surface)}
select{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--text-3) 50%),linear-gradient(135deg,var(--text-3) 50%,transparent 50%);background-position:calc(100% - 15px) 52%,calc(100% - 10px) 52%;background-size:5px 5px,5px 5px;background-repeat:no-repeat;padding-right:28px}

/* ---------- 입력 폼 ---------- */
.form-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.form-head strong{font-size:13px}
.seg{display:flex;gap:4px;background:var(--surface-3);padding:3px;border-radius:10px;margin-bottom:12px}
.seg button{flex:1;border:none;background:none;padding:7px 4px;border-radius:7px;font-size:13px;font-weight:600;color:var(--text-3);cursor:pointer}
.seg button.on{background:var(--surface);color:var(--text);box-shadow:0 1px 2px rgba(0,0,0,.06)}
.form-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:10px}
.f{display:flex;flex-direction:column;gap:4px;grid-column:span 2}
.f>span{font-size:11.5px;color:var(--text-3)}
.f.wide{grid-column:span 3}
.f.half{grid-column:span 3}
@media(max-width:700px){ .form-grid{grid-template-columns:1fr 1fr} .f,.f.wide,.f.half{grid-column:span 1} .f.full{grid-column:span 2} }
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0 4px}
.chips button{border:1px solid var(--line);background:var(--surface-2);border-radius:999px;padding:4px 11px;font-size:12px;color:var(--text-2);cursor:pointer}
.chips button:hover{border-color:var(--text-3);color:var(--text)}
.form .btn.primary{margin-top:12px}

/* ---------- 내역 ---------- */
.filters{display:grid;grid-template-columns:1.6fr 1fr 1fr;gap:8px;margin-bottom:12px}
@media(max-width:700px){ .filters{grid-template-columns:1fr 1fr} .filters input{grid-column:span 2} }
.daygroup{border-bottom:1px solid var(--line)}
.daygroup:last-child{border-bottom:none}
.dayhead{display:flex;justify-content:space-between;align-items:baseline;padding:12px 2px 6px;font-size:12px;color:var(--text-3)}
.dayhead .d{font-weight:700;color:var(--text-2);font-size:12.5px}
.item{display:flex;align-items:center;gap:10px;padding:9px 2px}
.item:hover{background:var(--surface-2)}
.item .cat{font-size:12px;color:var(--text-2);min-width:96px}
.item .desc{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .amt{font-weight:600;white-space:nowrap}
.item .amt.income,.item .amt.saving{color:var(--text-2)}
.item .acts{display:flex;gap:2px;opacity:.5}
.item:hover .acts{opacity:1}
.icon-btn{border:none;background:none;cursor:pointer;color:var(--text-3);padding:3px 5px;border-radius:6px;font-size:12px}
.icon-btn:hover{background:var(--surface-3);color:var(--text)}
@media(max-width:560px){ .item{flex-wrap:wrap} .item .cat{min-width:0} .item .desc{flex-basis:100%;order:3;font-size:12.5px;color:var(--text-2)} }

/* ---------- 차트 ---------- */
.catrow{margin-bottom:11px}
.catrow:last-child{margin-bottom:0}
.catrow .l{display:flex;justify-content:space-between;gap:10px;font-size:12.5px;margin-bottom:4px}
.catrow .l .r{color:var(--text-2);white-space:nowrap}
.trend{display:flex;align-items:flex-end;gap:10px;margin-top:6px}
.trend .col{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px}
.trend .bars{height:92px;display:flex;align-items:flex-end;gap:3px;width:100%;justify-content:center}
.trend .bars i{width:9px;border-radius:2px 2px 0 0;display:block}
.trend .bars i.inc{background:var(--surface-3);border:1px solid var(--line-2);border-bottom:none}
.trend .bars i.exp{background:var(--ink)}
.trend .m{font-size:10.5px;color:var(--text-3)}
.trend .m.now{color:var(--text);font-weight:700}
.legend{display:flex;gap:12px;font-size:11px;color:var(--text-3);margin-top:8px}
.legend i{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:4px}
.legend i.inc{background:var(--surface-3);border:1px solid var(--line-2)}
.legend i.exp{background:var(--ink)}

.kpi{display:flex;align-items:baseline;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.kpi .big{font-size:23px;font-weight:700;letter-spacing:-.03em}
.kpi .sub{font-size:12px;color:var(--text-3)}

table.budget{width:100%;border-collapse:collapse}
table.budget td{padding:7px 0;border-bottom:1px solid var(--line);vertical-align:middle}
table.budget td.c{width:32%;font-size:13px}
table.budget td.b{width:26%}
table.budget td.p{padding-left:12px}
table.budget input{padding:6px 8px;font-size:13px;text-align:right}
table.budget tr:last-child td{border-bottom:none}
.tagmini{font-size:10px;color:var(--text-3);border:1px solid var(--line);border-radius:4px;padding:0 4px;margin-left:5px;vertical-align:1px;white-space:nowrap}

.irr-item{display:flex;align-items:center;gap:8px;padding:7px 0;border-bottom:1px solid var(--line);font-size:13px}
.irr-item:last-of-type{border-bottom:none}
.irr-item .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.irr-form{display:grid;grid-template-columns:2fr 1.4fr 1fr auto;gap:8px;margin-top:12px}
@media(max-width:620px){ .irr-form{grid-template-columns:1fr 1fr !important} }

.settle{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:6px}
.settle .box{background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:12px}
.settle .box .k{font-size:11.5px;color:var(--text-3)}
.settle .box .v{font-size:16px;font-weight:700;margin-top:3px}
.result{background:var(--surface-3);border-radius:10px;padding:13px 14px;text-align:center;font-size:14px;font-weight:600}
.result .arrow{color:var(--text-3);margin:0 6px;font-weight:400}

.catman{display:flex;flex-wrap:wrap;gap:6px}
.catman .c{display:inline-flex;align-items:center;gap:4px;border:1px solid var(--line);background:var(--surface-2);border-radius:999px;padding:3px 10px;font-size:12px}
.catman .c.fixed{border-style:dashed}
.catman .c .icon-btn{padding:0 2px}
.filelabel{display:inline-block;border:1px solid var(--line-2);background:var(--surface);border-radius:var(--r-sm);padding:9px 14px;font-size:13px;font-weight:600;cursor:pointer}
.filelabel:hover{background:var(--surface-3)}
.btnrow{display:flex;flex-wrap:wrap;gap:8px}
.desc-r{font-weight:400;font-size:12.5px;text-align:right;color:var(--text-2)}

/* ---------- 동기화 표시 ---------- */
.sync{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;color:var(--text-3);margin-left:auto;white-space:nowrap}
.sync .dot{width:6px;height:6px;border-radius:50%;background:var(--line-2);flex:none}
.sync[data-s="ok"] .dot{background:var(--text-3)}
.sync[data-s="pending"] .dot{background:var(--text-2);animation:sync-blink 1.1s ease-in-out infinite}
.sync[data-s="offline"] .dot,.sync[data-s="error"] .dot{background:var(--text);box-shadow:0 0 0 3px var(--surface-3)}
.sync[data-s="offline"],.sync[data-s="error"]{color:var(--text-2)}
@keyframes sync-blink{50%{opacity:.25}}
</style>
</head>
<body>
<div class="wrap" id="app">

  <header class="top">
    <div class="brand">
      <h1>우리집 가계부</h1>
      <span class="tag">2인가구</span>
      <span class="sync" id="syncBadge" data-s="idle"><span class="dot"></span><span id="syncText"></span></span>
    </div>
    <nav class="tabs" id="tabs">
      <button data-view="dash" class="on">대시보드</button>
      <button data-view="list">내역</button>
      <button data-view="budget">예산·계획</button>
      <button data-view="settle">분담·정산</button>
      <button data-view="settings">설정</button>
    </nav>
  </header>

  <div class="monthbar" id="monthBar">
    <button class="nav-btn" id="prevMonth" type="button">‹</button>
    <div class="lbl" id="monthLabel"></div>
    <button class="nav-btn" id="nextMonth" type="button">›</button>
    <button class="today-btn" id="thisMonth" type="button">이번 달</button>
  </div>

  <main>
    <section class="view" id="view-dash"></section>
    <section class="view" id="view-list" hidden></section>
    <section class="view" id="view-budget" hidden></section>
    <section class="view" id="view-settle" hidden></section>
    <section class="view" id="view-settings" hidden></section>
  </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script>
/* =========================================================
   우리집 가계부 — 단일 HTML · Supabase 저장 + localStorage 캐시
   ========================================================= */

var SB_URL = 'https://fpffmmbuiomcfdrjxnck.supabase.co';
var SB_KEY = 'sb_publishable_Pm65kISKxBFgjVbZxIKI0g_rYUQbawS';

var KEY = 'hb_v2';
var LEGACY_KEY = 'household_ledger_entries';

/* 카테고리 메타
   t: 종류(income/expense/saving)  f: 고정비 여부  b: 50·30·20 버킷(need/want) */
var DEFAULT_CATS = [
  {n:'급여(나)',        t:'income'},
  {n:'급여(배우자)',    t:'income'},
  {n:'상여·성과급',     t:'income'},
  {n:'부수입',          t:'income'},
  {n:'금융소득',        t:'income'},
  {n:'기타수입',        t:'income'},

  {n:'주거·관리비',     t:'expense', f:1, b:'need'},
  {n:'통신·구독',       t:'expense', f:1, b:'need'},
  {n:'보험',            t:'expense', f:1, b:'need'},
  {n:'대출상환',        t:'expense', f:1, b:'need'},
  {n:'개인용돈',        t:'expense', f:1, b:'want'},
  {n:'식비·장보기',     t:'expense', f:0, b:'need'},
  {n:'외식·배달',       t:'expense', f:0, b:'want'},
  {n:'생활용품',        t:'expense', f:0, b:'need'},
  {n:'교통·차량',       t:'expense', f:0, b:'need'},
  {n:'의료·건강',       t:'expense', f:0, b:'need'},
  {n:'문화·여가',       t:'expense', f:0, b:'want'},
  {n:'쇼핑·의류',       t:'expense', f:0, b:'want'},
  {n:'미용·뷰티',       t:'expense', f:0, b:'want'},
  {n:'여행',            t:'expense', f:0, b:'want'},
  {n:'경조사',          t:'expense', f:0, b:'want'},
  {n:'반려동물',        t:'expense', f:0, b:'want'},
  {n:'교육·자기계발',   t:'expense', f:0, b:'want'},
  {n:'기타지출',        t:'expense', f:0, b:'want'},

  {n:'비상금',          t:'saving'},
  {n:'예·적금',         t:'saving'},
  {n:'투자(주식·ETF)',  t:'saving'},
  {n:'연금·IRP',        t:'saving'},
  {n:'주택청약',        t:'saving'},
  {n:'목돈 모으기',     t:'saving'}
];

var TYPE_LABEL = {income:'수입', expense:'지출', saving:'저축'};
var WD = ['일','월','화','수','목','금','토'];

function defaultDb(){
  return {
    entries: [],
    budgets: {},
    irregular: [],
    cats: [],
    settings: {
      meName:'나', partnerName:'배우자',
      myRatio:50,
      weeklyVar:0,
      emergencyNow:0, emergencyMonths:4
    }
  };
}

var db = defaultDb();
var view = 'dash';
var cursor = (function(){ var d = new Date(); d.setDate(1); return d; })();
var editingId = null;
var formType = 'expense';
var filter = {type:'all', cat:'all', q:''};
var lastDate = null;

/* ---------- 유틸 ---------- */
function $(s, r){ return (r || document).querySelector(s); }
function $$(s, r){ return Array.prototype.slice.call((r || document).querySelectorAll(s)); }
function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,6); }
function esc(s){
  return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
  });
}
function won(n){ return Math.round(n || 0).toLocaleString('ko-KR'); }
function money(n){ return won(n) + '<span class="u">원</span>'; }
function sum(arr){ return arr.reduce(function(a,b){ return a + b.amount; }, 0); }
function pct(a,b){ return b > 0 ? Math.round(a / b * 100) : 0; }
function clampW(v){ return Math.max(0, Math.min(100, v)); }
function digits(v){ return v.replace(/[^0-9]/g, ''); }

function allCats(){ return DEFAULT_CATS.concat(db.cats || []); }
function catsOf(t){ return allCats().filter(function(c){ return c.t === t; }); }
function meta(n){
  var f = allCats().filter(function(c){ return c.n === n; })[0];
  return f || {n:n, t:'expense', f:0, b:'want'};
}
function isFixed(e){ return (e.f === undefined || e.f === null) ? !!meta(e.category).f : !!e.f; }
function bucketOf(e){ return e.type === 'saving' ? 'save' : (meta(e.category).b || 'want'); }

function mkey(d){ return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0'); }
function shiftKey(d, delta){ return mkey(new Date(d.getFullYear(), d.getMonth() + delta, 1)); }
function daysIn(y, m){ return new Date(y, m, 0).getDate(); }
function dparts(s){
  var a = s.split('-').map(Number);
  return {y:a[0], m:a[1], d:a[2], wd:new Date(a[0], a[1]-1, a[2]).getDay()};
}

/* =========================================================
   저장 계층 — Supabase(원본) + localStorage(캐시)

   db 객체의 모양은 그대로 두고 저장·불러오기만 바꾼다.
   save()는 즉시 캐시에 쓰고, 500ms 뒤 서버와의 차이만 밀어 올린다.
   ========================================================= */

var sb = window.supabase ? window.supabase.createClient(SB_URL, SB_KEY) : null;
var META_ID = 'main';                   // ledger_meta 는 이 한 행만 쓴다
var synced = {entries:{}, meta:null};   // 마지막으로 서버와 일치시킨 내용의 지문
var syncTimer = null, pushing = false, needPush = false;

function cacheKey(){ return KEY + '_cache'; }
function sig(o){ return JSON.stringify(o); }
function chunk(a, n){ var o = []; for(var i = 0; i < a.length; i += n) o.push(a.slice(i, i + n)); return o; }

/* ---------- 행 <-> 항목 변환 ---------- */
function entryToRow(e){
  return {
    id: e.id,
    date: e.date,
    type: e.type,
    category: e.category,
    descr: e.desc || '',
    amount: Number(e.amount) || 0,
    payer: e.payer || 'common',
    fixed: (e.f === undefined || e.f === null || e.f === '') ? null : !!Number(e.f)
  };
}
function rowToEntry(r){
  var e = {
    id: r.id, date: r.date, type: r.type, category: r.category,
    desc: r.descr || '', amount: Number(r.amount) || 0, payer: r.payer || 'common'
  };
  if(r.fixed === true) e.f = 1;
  else if(r.fixed === false) e.f = 0;
  return e;
}
function metaRowOf(d){
  return {
    id: META_ID,
    budgets: d.budgets || {},
    irregular: d.irregular || [],
    cats: d.cats || [],
    settings: d.settings || {}
  };
}

/* ---------- 캐시 ---------- */
function normalizeDb(p){
  var d = Object.assign(defaultDb(), p || {});
  d.settings  = Object.assign(defaultDb().settings, (p && p.settings) || {});
  d.entries   = Array.isArray(d.entries) ? d.entries : [];
  d.cats      = Array.isArray(d.cats) ? d.cats : [];
  d.irregular = Array.isArray(d.irregular) ? d.irregular : [];
  d.budgets   = (d.budgets && typeof d.budgets === 'object') ? d.budgets : {};
  return d;
}
function writeCache(isDirty){
  try{ localStorage.setItem(cacheKey(), JSON.stringify({db:db, dirty:!!isDirty, at:Date.now()})); }catch(e){}
}
function readCache(){
  try{
    var raw = localStorage.getItem(cacheKey());
    if(!raw) return null;
    var p = JSON.parse(raw);
    if(!p || !p.db) return null;
    return {db: normalizeDb(p.db), dirty: !!p.dirty};
  }catch(e){ return null; }
}

/* 서버가 비어 있을 때 한 번만 쓰이는, Supabase 이전 버전의 로컬 데이터 */
function localLegacyDb(){
  var raw = null;
  try{ raw = localStorage.getItem(KEY); }catch(e){}
  if(raw){
    try{
      var p = JSON.parse(raw);
      if(p && Array.isArray(p.entries)) return normalizeDb(p);
    }catch(e){}
  }
  try{ raw = localStorage.getItem(LEGACY_KEY); }catch(e){ raw = null; }
  if(!raw) return null;
  var map = {
    '식비':'식비·장보기','교통비':'교통·차량','주거비':'주거·관리비','통신비':'통신·구독',
    '의료비':'의료·건강','문화생활':'문화·여가','쇼핑':'쇼핑·의류','교육':'교육·자기계발',
    '기타지출':'기타지출','급여':'급여(나)','용돈':'기타수입','부수입':'부수입','기타수입':'기타수입'
  };
  try{
    var old = JSON.parse(raw);
    if(!Array.isArray(old) || !old.length) return null;
    var d = defaultDb();
    d.entries = old.map(function(e){
      return {
        id: e.id || uid(),
        date: e.date,
        type: e.type === 'income' ? 'income' : 'expense',
        category: map[e.category] || (e.type === 'income' ? '기타수입' : '기타지출'),
        desc: e.desc || '',
        amount: Number(e.amount) || 0,
        payer: 'common'
      };
    }).filter(function(e){ return !!e.date; });
    return d;
  }catch(e){ return null; }
}

/* ---------- 동기화 상태 표시 ---------- */
var SYNC_TEXT = {idle:'', loading:'불러오는 중', pending:'저장 중', ok:'동기화됨', offline:'오프라인', error:'동기화 실패'};
var syncNow = 'idle';
function setSync(s, detail){
  syncNow = s;
  var el = $('#syncBadge');
  if(!el) return;
  el.dataset.s = s;
  $('#syncText').textContent = SYNC_TEXT[s] || '';
  el.title = detail || (s === 'offline' ? '이 기기에만 저장 중입니다. 연결되면 자동으로 올라갑니다.' : '');
}

/* ---------- 저장 ---------- */
function save(){
  writeCache(true);
  if(!sb) return;
  setSync('pending');
  clearTimeout(syncTimer);
  syncTimer = setTimeout(pushRemote, 500);
}

function pushRemote(){
  if(!sb) return Promise.resolve();
  if(pushing){ needPush = true; return Promise.resolve(); }
  clearTimeout(syncTimer);
  pushing = true;
  setSync('pending');

  var cur = {};
  db.entries.forEach(function(e){ cur[e.id] = e; });

  var ups = [];
  Object.keys(cur).forEach(function(id){
    var row = entryToRow(cur[id]);
    if(synced.entries[id] !== sig(row)) ups.push(row);
  });
  var dels = Object.keys(synced.entries).filter(function(id){ return !cur[id]; });

  var mrow = metaRowOf(db);
  var metaChanged = (synced.meta !== sig(mrow));

  var jobs = [];
  chunk(ups, 400).forEach(function(part){
    jobs.push(sb.from('entries').upsert(part, {onConflict:'id'}));
  });
  chunk(dels, 400).forEach(function(part){
    jobs.push(sb.from('entries').delete().in('id', part));
  });
  if(metaChanged) jobs.push(sb.from('ledger_meta').upsert(mrow, {onConflict:'id'}));

  if(!jobs.length){
    pushing = false;
    writeCache(false);
    setSync('ok');
    return Promise.resolve();
  }

  return Promise.all(jobs).then(function(res){
    var bad = res.filter(function(r){ return r && r.error; })[0];
    if(bad) throw bad.error;
    ups.forEach(function(r){ synced.entries[r.id] = sig(r); });
    dels.forEach(function(id){ delete synced.entries[id]; });
    if(metaChanged) synced.meta = sig(mrow);
    writeCache(false);
    setSync('ok');
  }).catch(function(err){
    setSync(navigator.onLine ? 'error' : 'offline', err && err.message);
  }).then(function(){
    pushing = false;
    if(needPush){ needPush = false; save(); }
  });
}

/* ---------- 불러오기 ---------- */
function fetchAllEntries(){
  var out = [], size = 1000;
  function step(page){
    return sb.from('entries')
      .select('id,date,type,category,descr,amount,payer,fixed')
      .order('date', {ascending:true}).order('id', {ascending:true})
      .range(page * size, page * size + size - 1)
      .then(function(r){
        if(r.error) throw r.error;
        var got = r.data || [];
        out = out.concat(got);
        return got.length < size ? out : step(page + 1);
      });
  }
  return step(0);
}

function pullRemote(){
  if(!sb) return Promise.resolve();
  setSync('loading');
  return Promise.all([
    fetchAllEntries(),
    sb.from('ledger_meta').select('*').eq('id', META_ID).maybeSingle()
  ]).then(function(r){
    if(r[1].error) throw r[1].error;
    var rows = r[0], m = r[1].data;

    var server = defaultDb();
    server.entries = rows.map(rowToEntry);
    if(m){
      server.budgets   = m.budgets || {};
      server.irregular = m.irregular || [];
      server.cats      = m.cats || [];
      server.settings  = Object.assign(defaultDb().settings, m.settings || {});
    }

    // 서버의 현재 상태를 기준선으로 기록해 두면, 이후 push는 차이만 보낸다.
    synced = {entries:{}, meta:sig(metaRowOf(server))};
    rows.forEach(function(row){ synced.entries[row.id] = sig(entryToRow(rowToEntry(row))); });

    var cache = readCache();
    if(cache && cache.dirty){
      db = cache.db;                       // 아직 못 올린 로컬 변경이 있으면 그쪽이 최신
      return pushRemote();
    }
    if(!rows.length && !m){
      var legacy = localLegacyDb();        // 최초 1회: 이 브라우저의 기존 내역을 서버로 이관
      if(legacy){
        db = legacy;
        return pushRemote().then(function(){
          if(syncNow !== 'ok') return;
          try{ localStorage.removeItem(KEY); localStorage.removeItem(LEGACY_KEY); }catch(e){}
          alert('이 브라우저에 있던 내역 ' + db.entries.length + '건을 서버로 옮겼습니다.');
        });
      }
    }
    db = server;
    writeCache(false);
    setSync('ok');
  }).catch(function(err){
    var cache = readCache();
    if(cache) db = cache.db;
    setSync(navigator.onLine ? 'error' : 'offline', err && err.message);
  });
}

/* ---------- 집계 ---------- */
function ofMonth(key){
  return db.entries.filter(function(e){ return e.date.slice(0,7) === key; });
}

function calc(key){
  var es  = ofMonth(key);
  var inc = es.filter(function(e){ return e.type === 'income'; });
  var exp = es.filter(function(e){ return e.type === 'expense'; });
  var sav = es.filter(function(e){ return e.type === 'saving'; });
  var fixed = exp.filter(isFixed);
  var vari  = exp.filter(function(e){ return !isFixed(e); });
  return {
    es:es, inc:inc, exp:exp, sav:sav, fixed:fixed, vari:vari,
    income: sum(inc), expense: sum(exp), saving: sum(sav),
    fixedSum: sum(fixed), variSum: sum(vari),
    need: sum(exp.filter(function(e){ return bucketOf(e) === 'need'; })),
    want: sum(exp.filter(function(e){ return bucketOf(e) === 'want'; }))
  };
}

function budgetTotal(){
  return Object.keys(db.budgets).reduce(function(a,k){ return a + (Number(db.budgets[k]) || 0); }, 0);
}
function variableBudgetTotal(){
  return Object.keys(db.budgets).filter(function(k){ return !meta(k).f; })
    .reduce(function(a,k){ return a + (Number(db.budgets[k]) || 0); }, 0);
}
function weeklyBudget(){
  var w = Number(db.settings.weeklyVar) || 0;
  if(w > 0) return w;
  var v = variableBudgetTotal();
  return v > 0 ? Math.round(v / 4 / 1000) * 1000 : 0;
}

/* 커서 기준 직전 n개월 평균 지출 (자료 없으면 이번 달) */
function avgExpense(n){
  var total = 0, cnt = 0;
  for(var i = 1; i <= n; i++){
    var es = ofMonth(shiftKey(cursor, -i));
    if(!es.length) continue;
    total += sum(es.filter(function(e){ return e.type === 'expense'; }));
    cnt++;
  }
  if(!cnt) return calc(mkey(cursor)).expense;
  return total / cnt;
}

function bar(value, max, cls){
  var w = max > 0 ? clampW(value / max * 100) : 0;
  return '<div class="bar"><i class="' + (cls || '') + '" style="width:' + w.toFixed(1) + '%"></i></div>';
}

/* =========================================================
   대시보드
   ========================================================= */
function renderDash(){
  var key = mkey(cursor);
  var c = calc(key);
  var left = c.income - c.expense - c.saving;
  var savingRate = c.income > 0 ? Math.round(c.saving / c.income * 100) : 0;
  var out = [];

  /* 1. 요약 */
  out.push(
    '<div class="stats">' +
      '<div class="s"><div class="k">수입</div><div class="v">' + money(c.income) + '</div></div>' +
      '<div class="s"><div class="k">지출</div><div class="v">' + money(c.expense) + '</div></div>' +
      '<div class="s"><div class="k">저축·투자</div><div class="v">' + money(c.saving) + '</div></div>' +
      '<div class="s dim"><div class="k">남은 돈</div><div class="v">' + money(left) + '</div></div>' +
    '</div>'
  );

  /* 2. 이번 달 페이스 */
  var bt = budgetTotal();
  var base = bt > 0 ? bt : Math.max(0, c.income - c.saving);
  var isNow = (key === mkey(new Date()));
  if(base > 0){
    var rest = base - c.expense;
    var dim = daysIn(cursor.getFullYear(), cursor.getMonth() + 1);
    var today = new Date();
    var restDays = isNow ? Math.max(1, dim - today.getDate() + 1) : dim;
    var perDay = rest > 0 ? rest / restDays : 0;
    var passed = isNow ? today.getDate() : dim;
    var idealPct = Math.round(passed / dim * 100);
    var usedPct = pct(c.expense, base);
    out.push(
      '<div class="card" style="margin-top:12px">' +
        '<div class="sec-head"><h2>이번 달 페이스</h2><span class="muted" style="font-size:11.5px">' +
          (bt > 0 ? '예산 ' : '수입−저축 ') + money(base) + '</span></div>' +
        '<p class="hint">막대가 기준선(지나간 날짜 비율)보다 왼쪽에 있으면 순항 중입니다.</p>' +
        '<div class="kpi"><div class="big">' + money(Math.abs(rest)) + '</div>' +
          '<div class="sub">' + (rest >= 0 ? '남음' : '초과') +
          (isNow && rest > 0 ? ' · 남은 ' + restDays + '일 동안 하루 ' + won(perDay) + '원' : '') + '</div></div>' +
        '<div class="bar"><i class="' + (usedPct > 100 ? 'over' : '') + '" style="width:' + clampW(usedPct) + '%"></i>' +
          '<span class="mark" style="left:' + clampW(idealPct) + '%"></span></div>' +
        '<div class="rowline" style="border:none;padding:8px 0 0">' +
          '<span class="k">' + usedPct + '% 사용</span><span class="k">기준선 ' + idealPct + '%</span></div>' +
      '</div>'
    );
  }

  var grid = [];

  /* 3. 50 · 30 · 20 */
  var g50 = c.income > 0 ? c.income : (c.need + c.want + c.saving);
  var rule = [
    ['필수 지출', c.need, 50, '주거·식비·교통·통신·보험'],
    ['여유 지출', c.want, 30, '외식·여가·쇼핑·여행'],
    ['저축·투자', c.saving, 20, '예적금·투자·연금·비상금']
  ].map(function(r){
    var p = pct(r[1], g50);
    return '<div class="catrow"><div class="l">' +
      '<span><strong>' + r[0] + '</strong> <span class="muted">' + r[3] + '</span></span>' +
      '<span class="r">' + p + '<span class="u">%</span> / 목표 ' + r[2] + '%</span></div>' +
      '<div class="bar"><i class="' + (p > r[2] ? 'over' : '') + '" style="width:' + clampW(p) + '%"></i>' +
      '<span class="mark" style="left:' + r[2] + '%"></span></div></div>';
  }).join('');
  grid.push(
    '<div class="card"><h2>50 · 30 · 20 배분</h2>' +
    '<p class="hint">수입을 필수 50 / 여유 30 / 저축 20으로 나누는 기본 규칙입니다. 세로선이 목표치입니다.</p>' +
    (g50 > 0 ? rule : '<div class="empty">수입을 입력하면 비율을 계산합니다.</div>') +
    '<div class="note">이번 달 저축률 <strong>' + savingRate + '%</strong> · 30대 2인가구는 20% 이상을 권장합니다.</div></div>'
  );

  /* 4. 고정비 · 변동비 */
  var fixPct = pct(c.fixedSum, c.expense);
  var irrYear = (db.irregular || []).reduce(function(a,i){ return a + (Number(i.amount) || 0); }, 0);
  grid.push(
    '<div class="card"><h2>고정비 · 변동비</h2>' +
    '<p class="hint">고정비는 자동이체로 묶어두고, 변동비만 주 단위로 관리하는 것이 가장 효과적입니다.</p>' +
    '<div class="catrow"><div class="l"><span><strong>고정비</strong></span><span class="r">' + money(c.fixedSum) + ' · ' + fixPct + '%</span></div>' +
      bar(c.fixedSum, c.expense) + '</div>' +
    '<div class="catrow"><div class="l"><span><strong>변동비</strong></span><span class="r">' + money(c.variSum) + ' · ' + (c.expense ? 100 - fixPct : 0) + '%</span></div>' +
      bar(c.variSum, c.expense, 'soft') + '</div>' +
    '<div class="note">' +
      (c.expense === 0 ? '내역을 입력하면 구성이 보입니다.' :
       fixPct >= 60 ? '고정비 비중이 높습니다. 통신·구독·보험부터 점검해 보세요.' :
       '고정비 비중이 안정적입니다.') +
      (irrYear > 0 ? '<br>비정기 지출 월 적립 권장액 <strong>' + won(Math.ceil(irrYear/12/1000)*1000) + '원</strong>' : '') +
    '</div></div>'
  );

  /* 5. 주간 변동비 */
  var wb = weeklyBudget();
  var dimM = daysIn(cursor.getFullYear(), cursor.getMonth() + 1);
  var weeks = [[1,7],[8,14],[15,21],[22,dimM]];
  var todayD = isNow ? new Date().getDate() : 0;
  var wRows = weeks.map(function(w, i){
    var v = sum(c.vari.filter(function(e){ var d = dparts(e.date).d; return d >= w[0] && d <= w[1]; }));
    var over = wb > 0 && v > wb;
    var cur = todayD >= w[0] && todayD <= w[1];
    return '<div class="catrow"><div class="l">' +
      '<span>' + (i+1) + '주차 <span class="muted">' + w[0] + '–' + w[1] + '일</span>' +
      (cur ? ' <span class="pill flat">이번 주</span>' : '') + '</span>' +
      '<span class="r">' + money(v) + (wb > 0 ? ' <span class="muted">/ ' + won(wb) + '</span>' : '') + '</span></div>' +
      '<div class="bar"><i class="' + (over ? 'over' : '') + '" style="width:' + clampW(wb > 0 ? v/wb*100 : 0) + '%"></i></div></div>';
  }).join('');
  grid.push(
    '<div class="card"><h2>주간 변동비</h2>' +
    '<p class="hint">월말에 몰아서 보면 늦습니다. 주마다 끊어서 보면 다음 주 소비를 조정할 수 있습니다.</p>' +
    wRows +
    '<div class="note">' + (wb > 0 ? '주간 예산 <strong>' + won(wb) + '원</strong> · 예산·계획 탭에서 변경할 수 있습니다.'
      : '예산·계획 탭에서 변동비 예산을 정하면 주간 목표가 생깁니다.') + '</div></div>'
  );

  /* 6. 카테고리별 지출 */
  var byCat = {};
  c.exp.forEach(function(e){ byCat[e.category] = (byCat[e.category] || 0) + e.amount; });
  var catKeys = Object.keys(byCat).sort(function(a,b){ return byCat[b] - byCat[a]; }).slice(0, 8);
  var maxCat = catKeys.length ? byCat[catKeys[0]] : 0;
  grid.push(
    '<div class="card"><h2>카테고리별 지출</h2>' +
    '<p class="hint">예산을 정한 항목은 예산 대비 소진율로, 초과분은 빗금으로 표시됩니다.</p>' +
    (catKeys.length ? catKeys.map(function(k){
      var v = byCat[k], b = Number(db.budgets[k]) || 0;
      var over = b > 0 && v > b;
      return '<div class="catrow"><div class="l">' +
        '<span>' + esc(k) + (meta(k).f ? '<span class="tagmini">고정</span>' : '') + '</span>' +
        '<span class="r">' + money(v) + (b > 0 ? ' <span class="muted">/ ' + won(b) + ' · ' + pct(v,b) + '%</span>' : '') + '</span></div>' +
        '<div class="bar"><i class="' + (over ? 'over' : '') + '" style="width:' +
          clampW(b > 0 ? v/b*100 : (maxCat ? v/maxCat*100 : 0)) + '%"></i></div></div>';
    }).join('') : '<div class="empty">지출 내역이 없습니다.</div>') +
    '</div>'
  );

  /* 7. 전월 대비 */
  var pk = shiftKey(cursor, -1);
  var pc = calc(pk);
  var diff = c.expense - pc.expense;
  var prevByCat = {};
  pc.exp.forEach(function(e){ prevByCat[e.category] = (prevByCat[e.category] || 0) + e.amount; });
  var keys = Object.keys(byCat).concat(Object.keys(prevByCat)).filter(function(v,i,a){ return a.indexOf(v) === i; });
  var changes = keys.map(function(k){ return {k:k, d:(byCat[k]||0) - (prevByCat[k]||0)}; })
    .filter(function(x){ return x.d !== 0; })
    .sort(function(a,b){ return Math.abs(b.d) - Math.abs(a.d); }).slice(0,4);
  grid.push(
    '<div class="card"><h2>전월 대비</h2>' +
    '<p class="hint">' + pk.slice(0,4) + '년 ' + Number(pk.slice(5)) + '월 지출과 비교했습니다.</p>' +
    '<div class="kpi"><div class="big">' + (diff > 0 ? '+' : diff < 0 ? '−' : '') + won(Math.abs(diff)) + '<span class="u">원</span></div>' +
      '<div class="sub">' + (pc.expense > 0 ? (diff >= 0 ? '늘었습니다' : '줄었습니다') + ' · ' + Math.abs(pct(diff, pc.expense)) + '%'
        : '비교할 지난달 지출이 없습니다') + '</div></div>' +
    (changes.length ? changes.map(function(x){
      return '<div class="rowline"><span class="k">' + esc(x.k) + '</span><span class="v">' +
        (x.d > 0 ? '+' : '−') + won(Math.abs(x.d)) + '<span class="u">원</span></span></div>';
    }).join('') : '<div class="empty">변동 내역이 없습니다.</div>') +
    '</div>'
  );

  /* 8. 비상금 */
  var months = Number(db.settings.emergencyMonths) || 4;
  var avg3 = avgExpense(3);
  var need = avg3 * months;
  var now = Number(db.settings.emergencyNow) || 0;
  grid.push(
    '<div class="card"><h2>비상금</h2>' +
    '<p class="hint">둘 중 한 명의 소득이 끊겨도 고정비는 그대로 나갑니다. 생활비 ' + months + '개월치가 기준입니다.</p>' +
    '<div class="kpi"><div class="big">' + money(now) + '</div>' +
      '<div class="sub">목표 ' + won(need) + '원 · ' + pct(now, need) + '%</div></div>' +
    bar(now, need) +
    '<div class="note">최근 3개월 평균 지출 ' + won(avg3) + '원 기준입니다. 설정 탭에서 현재 잔액과 목표 개월수를 바꿀 수 있습니다.</div></div>'
  );

  /* 9. 최근 6개월 추이 */
  var series = [];
  for(var i = 5; i >= 0; i--){
    var k = shiftKey(cursor, -i);
    var cc = calc(k);
    series.push({k:k, inc:cc.income, exp:cc.expense + cc.saving});
  }
  var mx = Math.max.apply(null, series.map(function(s){ return Math.max(s.inc, s.exp); }).concat([1]));
  grid.push(
    '<div class="card"><h2>최근 6개월 추이</h2><p class="hint">오른쪽 진한 막대에는 저축·투자가 포함됩니다.</p>' +
    '<div class="trend">' + series.map(function(s){
      return '<div class="col"><div class="bars">' +
        '<i class="inc" style="height:' + Math.max(2, s.inc/mx*100) + '%"></i>' +
        '<i class="exp" style="height:' + Math.max(2, s.exp/mx*100) + '%"></i>' +
        '</div><div class="m' + (s.k === mkey(cursor) ? ' now' : '') + '">' + Number(s.k.slice(5)) + '월</div></div>';
    }).join('') + '</div>' +
    '<div class="legend"><span><i class="inc"></i>수입</span><span><i class="exp"></i>지출 + 저축</span></div></div>'
  );

  /* 10. 이번 달 비정기 지출 */
  var thisIrr = (db.irregular || []).filter(function(i){ return Number(i.month) === (cursor.getMonth() + 1); });
  if(thisIrr.length){
    grid.push(
      '<div class="card"><h2>이번 달 예정된 비정기 지출</h2>' +
      '<p class="hint">미리 알고 있으면 갑작스러운 지출이 아닙니다.</p>' +
      thisIrr.map(function(i){
        return '<div class="rowline"><span class="k">' + esc(i.name) + '</span><span class="v">' + money(i.amount) + '</span></div>';
      }).join('') +
      '<div class="rowline" style="border-top:1px solid var(--line)"><span class="k"><strong>합계</strong></span><span class="v">' +
        money(thisIrr.reduce(function(a,i){ return a + Number(i.amount); }, 0)) + '</span></div></div>'
    );
  }

  out.push('<div class="grid two" style="margin-top:12px">' + grid.join('') + '</div>');
  $('#view-dash').innerHTML = out.join('');
}

function renderList(){
  var key = mkey(cursor);
  var s = db.settings;
  var payerLabel = {common:'공동', me:esc(s.meName), partner:esc(s.partnerName)};

  var catOpts = catsOf(formType).map(function(c){
    return '<option value="' + esc(c.n) + '">' + esc(c.n) + '</option>';
  }).join('');

  /* 자주 쓰는 항목 */
  var freq = {};
  db.entries.forEach(function(e){
    if(!e.desc) return;
    var k = e.type + '|' + e.category + '|' + e.desc;
    if(!freq[k]) freq[k] = {c:0, e:e};
    freq[k].c++;

      '<label class="f"><span>금액</span><input type="text" id="fAmount" inputmode="numeric" placeholder="0" required></label>' +
      '<label class="f"><span>결제</span><select id="fPayer">' +

  /* 필터 */

  var tot = sum(list.filter(function(e){ return e.type === 'expense'; }));
  $('#view-list').innerHTML = form +
    '<div class="card" style="margin-top:12px">' + filters +
    '<div class="rowline"><span class="k">' + list.length + '건</span>' +
    '<span class="v">지출 합계 ' + money(tot) + '</span></div>' + body + '</div>';

  var ed = editingId ? db.entries.filter(function(e){ return e.id === editingId; })[0] : null;
  $('#fDate').value = ed ? ed.date : (lastDate || new Date().toISOString().slice(0,10));

    $('#fAmount').value = won(ed.amount);

  bindList();
}

function bindAmount(el){
  if(!el) return;
  el.addEventListener('input', function(){
    var v = digits(el.value);
    el.value = v ? Number(v).toLocaleString('ko-KR') : '';
  });
}

function bindList(){
  $$('#typeSeg button').forEach(function(b){
    b.onclick = function(){ formType = b.dataset.type; renderList(); };
  });

  bindAmount($('#fAmount'));

  $('#entryForm').addEventListener('submit', function(ev){
    ev.preventDefault();
    var amount = Number(digits($('#fAmount').value));
    var date = $('#fDate').value;
    if(!date || !amount) return;
    var fSel = $('#fFixed') ? $('#fFixed').value : 'auto';
    var data = {
      date: date,
      type: formType,
      category: $('#fCat').value,
      desc: $('#fDesc').value.trim(),
      amount: amount,
      payer: $('#fPayer').value,
      f: (formType === 'expense' && fSel !== 'auto') ? (fSel === '1') : undefined
    };
    if(editingId){
      var i = db.entries.map(function(e){ return e.id; }).indexOf(editingId);
      if(i > -1) db.entries[i] = Object.assign({}, db.entries[i], data);
      editingId = null;
    }else{
      db.entries.push(Object.assign({id: uid()}, data));
      cursor = new Date(Number(date.slice(0,4)), Number(date.slice(5,7)) - 1, 1);
    }
    lastDate = date;
    save();
    renderHeader();
    renderList();
    $('#fDesc').focus();
  });

  var ce = $('#cancelEdit');
  if(ce) ce.onclick = function(){ editingId = null; renderList(); };

  $$('[data-edit]').forEach(function(b){
    b.onclick = function(){
      var e = db.entries.filter(function(x){ return x.id === b.dataset.edit; })[0];
      if(!e) return;
      editingId = e.id;
      formType = e.type;
      renderList();
      window.scrollTo({top:0, behavior:'smooth'});
    };
  });

  $$('[data-del]').forEach(function(b){
    b.onclick = function(){
      if(!confirm('이 내역을 삭제할까요?')) return;
      db.entries = db.entries.filter(function(e){ return e.id !== b.dataset.del; });
      if(editingId === b.dataset.del) editingId = null;
      save();
      renderList();
    };
  });

  $$('[data-quick]').forEach(function(b){
    b.onclick = function(){
      var q = JSON.parse(b.dataset.quick);
      formType = q.t;
      renderList();
      $('#fCat').value = q.c;
      $('#fDesc').value = q.d;
      $('#fAmount').value = won(q.a);
      $('#fPayer').value = q.p;
    };
  });

  $('#fq').addEventListener('input', function(e){
    var pos = e.target.selectionStart;
    filter.q = e.target.value;
    renderList();
    var el = $('#fq');
    el.focus();
    el.setSelectionRange(pos, pos);
  });
  $('#ftype').onchange = function(e){ filter.type = e.target.value; renderList(); };
  $('#fcat').onchange  = function(e){ filter.cat  = e.target.value; renderList(); };
}

function renderBudget(){

  var c = calc(key);
  var byCat = {};
  c.exp.forEach(function(e){ byCat[e.category] = (byCat[e.category] || 0) + e.amount; });

  var maxSpent = Math.max.apply(null, catsOf('expense').map(function(cat){ return byCat[cat.n] || 0; }).concat([1]));
  var rows = catsOf('expense').map(function(cat){
    var b = Number(db.budgets[cat.n]) || 0;
    var v = byCat[cat.n] || 0;
    var over = b > 0 && v > b;
    return '<tr>' +
      '<td class="c">' + esc(cat.n) + (cat.f ? '<span class="tagmini">고정</span>' : '') + '</td>' +
      '<td class="b"><input type="text" inputmode="numeric" data-budget="' + esc(cat.n) + '" value="' +
        (b ? won(b) : '') + '" placeholder="0"></td>' +
      '<td class="p">' + bar(v, b || maxSpent, b ? (over ? 'over' : '') : 'soft') +
        '<div style="font-size:11.5px;color:var(--text-3);margin-top:3px">' + won(v) + '원' +
        (b ? ' · ' + pct(v,b) + '%' : (v ? ' · 예산 미설정' : '')) + '</div></td></tr>';
  }).join('');

  var bt = budgetTotal();
  var wb = weeklyBudget();
  var irr = db.irregular || [];
  var irrTotal = irr.reduce(function(a,i){ return a + (Number(i.amount) || 0); }, 0);

  var irrRows = irr.length ? irr.slice().sort(function(a,b){ return a.month - b.month; }).map(function(i){
    return '<div class="irr-item"><span class="nm">' + esc(i.name) + '</span>' +
      '<span class="muted">' + i.month + '월</span>' +
      '<span><strong>' + won(i.amount) + '</strong><span class="u">원</span></span>' +
      '<button class="icon-btn" data-delirr="' + esc(i.id) + '">✕</button></div>';
  }).join('') : '<div class="empty" style="padding:18px">등록된 비정기 지출이 없습니다.</div>';

  $('#view-budget').innerHTML =
  '<div class="card"><div class="sec-head"><h2>카테고리 월 예산</h2>' +
    '<span class="muted" style="font-size:11.5px">합계 ' + money(bt) + '</span></div>' +
    '<p class="hint">모든 항목을 채울 필요는 없습니다. 새는 곳부터 3~5개만 정해도 충분합니다. 오른쪽 막대는 ' +
      (cursor.getMonth() + 1) + '월 실적입니다.</p>' +
    '<table class="budget">' + rows + '</table>' +
    '<div class="note">예산을 넘긴 항목은 빗금으로 표시됩니다. 예산 합계는 대시보드의 이번 달 페이스 기준이 됩니다.</div></div>' +

  '<div class="grid two" style="margin-top:12px">' +
    '<div class="card"><h2>주간 변동비 예산</h2>' +
      '<p class="hint">변동비는 월이 아니라 주 단위로 봐야 다음 주를 조정할 수 있습니다.</p>' +
      '<label class="f" style="grid-column:auto"><span>한 주 예산 (비우면 변동비 예산 ÷ 4로 자동 계산)</span>' +
      '<input type="text" inputmode="numeric" id="weeklyVar" value="' +
        (db.settings.weeklyVar ? won(db.settings.weeklyVar) : '') + '" placeholder="' + (wb ? won(wb) : '0') + '"></label>' +
      '<div class="note">현재 적용값 <strong>' + won(wb) + '원</strong> · 변동비 예산 합계 ' + won(variableBudgetTotal()) + '원</div></div>' +

    '<div class="card"><h2>비정기 지출 계획</h2>' +
      '<p class="hint">명절·경조사·자동차세·보험 연납·여행처럼 1년에 한두 번 나가는 큰돈을 미리 적어두고 매달 나눠 모읍니다.</p>' +
      '<div class="kpi"><div class="big">' + won(Math.ceil(irrTotal/12/1000)*1000) + '<span class="u">원</span></div>' +
        '<div class="sub">매달 적립 권장 · 연 합계 ' + won(irrTotal) + '원</div></div>' +
      irrRows +
      '<div class="irr-form">' +
        '<input type="text" id="irrName" placeholder="항목 (예: 자동차보험)">' +
        '<input type="text" inputmode="numeric" id="irrAmount" placeholder="금액">' +
        '<select id="irrMonth">' +
          Array.apply(null, {length:12}).map(function(_, i){
            return '<option value="' + (i+1) + '"' + ((i+1) === (cursor.getMonth()+1) ? ' selected' : '') + '>' + (i+1) + '월</option>';
          }).join('') + '</select>' +
        '<button class="btn" id="addIrr" type="button">추가</button>' +
      '</div></div>' +
  '</div>';

  $$('[data-budget]').forEach(function(inp){
    bindAmount(inp);
    inp.addEventListener('change', function(){
      var v = Number(digits(inp.value)) || 0;
      if(v) db.budgets[inp.dataset.budget] = v;
      else delete db.budgets[inp.dataset.budget];
      save();
      renderBudget();
    });
  });

  var wv = $('#weeklyVar');
  bindAmount(wv);
  wv.addEventListener('change', function(){
    db.settings.weeklyVar = Number(digits(wv.value)) || 0;
    save();
    renderBudget();
  });

  bindAmount($('#irrAmount'));
  $('#addIrr').onclick = function(){
    var name = $('#irrName').value.trim();
    var amount = Number(digits($('#irrAmount').value)) || 0;
    if(!name || !amount) return;
    db.irregular.push({id: uid(), name: name, amount: amount, month: Number($('#irrMonth').value)});
    save();
    renderBudget();
  };
  $$('[data-delirr]').forEach(function(b){
    b.onclick = function(){
      db.irregular = db.irregular.filter(function(i){ return i.id !== b.dataset.delirr; });
      save();
      renderBudget();
    };
  });
}

/* =========================================================
   분담 · 정산
   ========================================================= */
function renderSettle(){
  var c = calc(mkey(cursor));
  var s = db.settings;
  var ratio = Math.max(0, Math.min(100, Number(s.myRatio) || 0));

  /* 개인용돈은 각자 몫이므로 정산 대상에서 제외 */
  var shareable = c.exp.filter(function(e){ return e.category !== '개인용돈'; });
  var paidMe = sum(shareable.filter(function(e){ return e.payer === 'me'; }));
  var paidPartner = sum(shareable.filter(function(e){ return e.payer === 'partner'; }));
  var paidCommon = sum(shareable.filter(function(e){ return !e.payer || e.payer === 'common'; }));
  var personal = paidMe + paidPartner;
  var myShare = personal * ratio / 100;
  var diff = paidMe - myShare;

  var result;
  if(personal === 0) result = '개인 결제 내역이 없어 정산할 금액이 없습니다.';
  else if(Math.abs(diff) < 500) result = '거의 정확히 맞습니다. 정산할 금액이 없습니다.';
  else if(diff > 0) result = esc(s.partnerName) + '<span class="arrow">→</span>' + esc(s.meName) + '  <strong>' + won(Math.abs(diff)) + '원</strong>';
  else result = esc(s.meName) + '<span class="arrow">→</span>' + esc(s.partnerName) + '  <strong>' + won(Math.abs(diff)) + '원</strong>';

  var incMe = sum(c.inc.filter(function(e){ return e.category === '급여(나)'; }));
  var incPartner = sum(c.inc.filter(function(e){ return e.category === '급여(배우자)'; }));
  var suggest = (incMe + incPartner) > 0 ? Math.round(incMe / (incMe + incPartner) * 100) : null;

  var expMe = sum(c.exp.filter(function(e){ return e.payer === 'me'; }));
  var expPartner = sum(c.exp.filter(function(e){ return e.payer === 'partner'; }));
  var allowance = c.exp.filter(function(e){ return e.category === '개인용돈'; });

  $('#view-settle').innerHTML =
  '<div class="card"><h2>이번 달 공동생활비 정산</h2>' +
    '<p class="hint">공동 계좌·카드로 낸 돈은 이미 함께 낸 것으로 보고, 각자 개인적으로 결제한 금액만 정산합니다. 개인용돈은 제외됩니다.</p>' +
    '<div class="settle">' +
      '<div class="box"><div class="k">' + esc(s.meName) + ' 결제</div><div class="v">' + money(paidMe) + '</div></div>' +
      '<div class="box"><div class="k">' + esc(s.partnerName) + ' 결제</div><div class="v">' + money(paidPartner) + '</div></div>' +
    '</div>' +
    '<div class="rowline"><span class="k">공동 계좌·카드 결제</span><span class="v">' + money(paidCommon) + '</span></div>' +
    '<div class="rowline"><span class="k">정산 대상 (개인 결제 합계)</span><span class="v">' + money(personal) + '</span></div>' +
    '<div class="rowline"><span class="k">분담 비율</span><span class="v">' + esc(s.meName) + ' ' + ratio + '% · ' + esc(s.partnerName) + ' ' + (100 - ratio) + '%</span></div>' +
    '<div class="rowline"><span class="k">' + esc(s.meName) + ' 부담해야 할 몫</span><span class="v">' + money(myShare) + '</span></div>' +
    '<div class="result" style="margin-top:12px">' + result + '</div>' +
    '<div class="note">분담 비율은 설정 탭에서 바꿀 수 있습니다.' +
      (suggest !== null ? ' 이번 달 급여 기준 소득 비례 비율은 <strong>' + suggest + ' : ' + (100 - suggest) + '</strong> 입니다.' : '') +
    '</div></div>' +

  '<div class="grid two" style="margin-top:12px">' +
    '<div class="card"><h2>결제 수단별 지출</h2>' +
      '<p class="hint">공동 지출 비중이 높을수록 매달 계산이 단순해집니다.</p>' +
      '<div class="catrow"><div class="l"><span>공동</span><span class="r">' + money(paidCommon) + ' · ' + pct(paidCommon, c.expense) + '%</span></div>' +
        bar(paidCommon, c.expense) + '</div>' +
      '<div class="catrow"><div class="l"><span>' + esc(s.meName) + '</span><span class="r">' + money(expMe) + '</span></div>' +
        bar(expMe, c.expense, 'soft') + '</div>' +
      '<div class="catrow"><div class="l"><span>' + esc(s.partnerName) + '</span><span class="r">' + money(expPartner) + '</span></div>' +
        bar(expPartner, c.expense, 'soft') + '</div>' +
      '<div class="note">공동 고정비는 한 계좌에서 자동이체로 빠져나가게 두면 연체와 계산 다툼이 함께 줄어듭니다.</div></div>' +

    '<div class="card"><h2>개인용돈</h2>' +
      '<p class="hint">서로 간섭하지 않는 돈을 정해두면 나머지 예산 대화가 훨씬 쉬워집니다.</p>' +
      '<div class="rowline"><span class="k">' + esc(s.meName) + '</span><span class="v">' +
        money(sum(allowance.filter(function(e){ return e.payer === 'me'; }))) + '</span></div>' +
      '<div class="rowline"><span class="k">' + esc(s.partnerName) + '</span><span class="v">' +
        money(sum(allowance.filter(function(e){ return e.payer === 'partner'; }))) + '</span></div>' +
      '<div class="rowline"><span class="k">합계</span><span class="v">' + money(sum(allowance)) + '</span></div>' +
      '<div class="note">개인용돈 카테고리로 입력한 지출은 정산 계산에서 빠집니다.</div></div>' +
  '</div>';
}

/* =========================================================
   설정
   ========================================================= */
function renderSettings(){
  var s = db.settings;
  var cats = allCats();
  var custom = (db.cats || []).map(function(c){ return c.n; });
  var dates = db.entries.map(function(e){ return e.date; }).sort();

  $('#view-settings').innerHTML =
  '<div class="grid two">' +
    '<div class="card"><h2>가구 설정</h2>' +
      '<p class="hint">이름과 분담 비율은 내역 입력과 정산 화면에 사용됩니다.</p>' +
      '<div class="form-grid">' +
        '<label class="f half full"><span>내 이름</span><input type="text" id="setMe" value="' + esc(s.meName) + '"></label>' +
        '<label class="f half full"><span>배우자 이름</span><input type="text" id="setPartner" value="' + esc(s.partnerName) + '"></label>' +
        '<label class="f half full"><span>내 분담 비율 (%)</span><input type="number" id="setRatio" min="0" max="100" value="' + (Number(s.myRatio) || 0) + '"></label>' +
        '<label class="f half full"><span>비상금 목표 개월수</span><input type="number" id="setMonths" min="1" max="24" value="' + (Number(s.emergencyMonths) || 4) + '"></label>' +
        '<label class="f wide full"><span>현재 비상금 잔액</span><input type="text" inputmode="numeric" id="setEmg" value="' +
          (s.emergencyNow ? won(s.emergencyNow) : '') + '" placeholder="0"></label>' +
      '</div>' +
      '<div class="note">30대 2인가구는 한쪽 소득이 끊겨도 버틸 수 있도록 생활비 4개월치를 비상금 기준으로 잡습니다.</div></div>' +

    '<div class="card"><h2>데이터 관리</h2>' +
      '<p class="hint">내역은 Supabase 서버에 저장되고, 이 브라우저에는 사본이 남아 오프라인에서도 열립니다. 어느 기기에서 열어도 같은 내역을 봅니다.</p>' +
      '<div class="btnrow">' +
        '<button class="btn" id="btnPull" type="button">서버에서 다시 불러오기</button>' +
      '</div>' +
      '<div class="btnrow" style="margin-top:8px">' +
        '<button class="btn" id="btnExport" type="button">백업 파일 내려받기</button>' +
        '<label class="filelabel">복원하기<input type="file" id="fileImport" accept="application/json,.json" hidden></label>' +
        '<button class="btn" id="btnReset" type="button"><span class="danger">전체 삭제</span></button>' +
      '</div>' +
      '<div class="note">저장된 내역 <strong>' + db.entries.length + '건</strong>' +
        (dates.length ? ' · ' + dates[0] + ' ~ ' + dates[dates.length-1] : '') +
        '<br>전체 삭제와 복원은 서버 내역에도 그대로 반영됩니다.</div></div>' +
  '</div>' +

  '<div class="card" style="margin-top:12px"><h2>카테고리</h2>' +
    '<p class="hint">점선 테두리는 고정비입니다. 지출 카테고리는 50·30·20 계산에서 필수 / 여유로 나뉩니다.</p>' +
    ['expense','income','saving'].map(function(t){
      return '<div style="margin-bottom:14px">' +
        '<div class="rowline" style="border:none;padding:0 0 6px"><span class="k"><strong>' +
        (t === 'saving' ? '저축·투자' : TYPE_LABEL[t]) + '</strong></span></div><div class="catman">' +
        cats.filter(function(c){ return c.t === t; }).map(function(c){
          return '<span class="c' + (c.f ? ' fixed' : '') + '">' + esc(c.n) +
            (t === 'expense' ? '<span class="tagmini">' + (c.b === 'need' ? '필수' : '여유') + '</span>' : '') +
            (custom.indexOf(c.n) > -1 ? '<button class="icon-btn" data-delcat="' + esc(c.n) + '">✕</button>' : '') +
            '</span>';
        }).join('') + '</div></div>';
    }).join('') +
    '<div class="irr-form" style="grid-template-columns:2fr 1fr 1fr 1fr auto">' +
      '<input type="text" id="newCatName" placeholder="새 카테고리 이름">' +
      '<select id="newCatType"><option value="expense">지출</option><option value="income">수입</option><option value="saving">저축·투자</option></select>' +
      '<select id="newCatFixed"><option value="0">변동비</option><option value="1">고정비</option></select>' +
      '<select id="newCatBucket"><option value="need">필수(50)</option><option value="want">여유(30)</option></select>' +
      '<button class="btn" id="addCat" type="button">추가</button>' +
    '</div></div>' +

  '<div class="card" style="margin-top:12px"><h2>이 가계부가 따르는 기준</h2>' +
    '<div class="rowline"><span class="k">50 · 30 · 20</span><span class="v desc-r">필수 50% / 여유 30% / 저축·투자 20%</span></div>' +
    '<div class="rowline"><span class="k">고정비 · 변동비 분리</span><span class="v desc-r">고정비는 자동이체, 변동비는 주 단위 관리</span></div>' +
    '<div class="rowline"><span class="k">비정기 지출</span><span class="v desc-r">연간 합계를 12로 나눠 매달 적립</span></div>' +
    '<div class="rowline"><span class="k">비상금</span><span class="v desc-r">생활비 4개월치 확보</span></div>' +
    '<div class="rowline"><span class="k">공동생활비</span><span class="v desc-r">공동 계좌 중심 + 개인 결제분만 정산</span></div>' +
  '</div>';

  function bindChange(id, fn){
    var el = $(id);
    el.addEventListener('change', function(){ fn(el); save(); renderSettings(); });
  }
  bindChange('#setMe', function(el){ db.settings.meName = el.value.trim() || '나'; });
  bindChange('#setPartner', function(el){ db.settings.partnerName = el.value.trim() || '배우자'; });
  bindChange('#setRatio', function(el){ db.settings.myRatio = Math.max(0, Math.min(100, Number(el.value) || 0)); });
  bindChange('#setMonths', function(el){ db.settings.emergencyMonths = Math.max(1, Number(el.value) || 4); });

  var emg = $('#setEmg');
  bindAmount(emg);
  emg.addEventListener('change', function(){
    db.settings.emergencyNow = Number(digits(emg.value)) || 0;
    save();
  });

  $('#newCatType').onchange = function(e){
    var isExp = e.target.value === 'expense';
    $('#newCatFixed').disabled = !isExp;
    $('#newCatBucket').disabled = !isExp;
  };
  $('#addCat').onclick = function(){
    var n = $('#newCatName').value.trim();
    if(!n) return;
    if(allCats().some(function(c){ return c.n === n; })){ alert('이미 있는 카테고리입니다.'); return; }
    var t = $('#newCatType').value;
    var c = {n:n, t:t};
    if(t === 'expense'){
      c.f = $('#newCatFixed').value === '1' ? 1 : 0;
      c.b = $('#newCatBucket').value;
    }
    db.cats.push(c);
    save();
    renderSettings();
  };
  $$('[data-delcat]').forEach(function(b){
    b.onclick = function(){
      db.cats = db.cats.filter(function(c){ return c.n !== b.dataset.delcat; });
      save();
      renderSettings();
    };
  });

  $('#btnPull').onclick = function(){
    var b = $('#btnPull');
    b.disabled = true;
    b.textContent = '불러오는 중…';
    pullRemote().then(function(){
      render();
      if(syncNow !== 'ok') alert('서버에서 불러오지 못했습니다. 연결을 확인해 주세요.');
    });
  };

  $('#btnExport').onclick = function(){
    var blob = new Blob([JSON.stringify(db, null, 2)], {type:'application/json'});
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = '가계부-백업-' + new Date().toISOString().slice(0,10) + '.json';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(function(){ URL.revokeObjectURL(a.href); }, 1000);
  };

  $('#fileImport').onchange = function(ev){
    var file = ev.target.files[0];
    if(!file) return;
    var rd = new FileReader();
    rd.onload = function(){
      try{
        var p = JSON.parse(rd.result);
        if(!p || !Array.isArray(p.entries)) throw new Error('형식 오류');
        if(!confirm('현재 데이터를 백업 파일 내용으로 덮어씁니다. 계속할까요?')) return;
        db = Object.assign(defaultDb(), p);
        db.settings = Object.assign(defaultDb().settings, p.settings || {});
        save();
        render();
        alert('복원했습니다. 내역 ' + db.entries.length + '건');
      }catch(e){
        alert('백업 파일을 읽을 수 없습니다.');
      }
    };
    rd.readAsText(file);
    ev.target.value = '';
  };

  $('#btnReset').onclick = function(){
    if(!confirm('모든 내역과 설정을 삭제합니다. 되돌릴 수 없습니다. 계속할까요?')) return;
    if(!confirm('정말 삭제할까요? 백업을 먼저 내려받는 것을 권합니다.')) return;
    db = defaultDb();
    save();
    render();
  };
}

/* =========================================================
   공통 렌더 / 이벤트
   ========================================================= */
function renderHeader(){
  $('#monthLabel').textContent = cursor.getFullYear() + '년 ' + (cursor.getMonth() + 1) + '월';
  $('#monthBar').hidden = (view === 'settings');
  $$('#tabs button').forEach(function(b){ b.classList.toggle('on', b.dataset.view === view); });
  $$('.view').forEach(function(v){ v.hidden = (v.id !== 'view-' + view); });
}

function render(){
  renderHeader();
  if(view === 'dash') renderDash();
  else if(view === 'list') renderList();
  else if(view === 'budget') renderBudget();
  else if(view === 'settle') renderSettle();
  else renderSettings();
}

$$('#tabs button').forEach(function(b){
  b.onclick = function(){ view = b.dataset.view; editingId = null; render(); };
});
$('#prevMonth').onclick = function(){ cursor = new Date(cursor.getFullYear(), cursor.getMonth() - 1, 1); render(); };
$('#nextMonth').onclick = function(){ cursor = new Date(cursor.getFullYear(), cursor.getMonth() + 1, 1); render(); };
$('#thisMonth').onclick = function(){ var d = new Date(); d.setDate(1); cursor = d; render(); };

/* =========================================================
   시작
   ========================================================= */
var cached = readCache();
db = cached ? cached.db : defaultDb();
render();                           // 캐시로 먼저 그리고

if(sb){
  pullRemote().then(render);        // 서버와 맞춘 뒤 다시 그린다

  /* 아직 못 올린 변경이 있으면 탭을 떠나기 전에 밀어 올린다 */
  document.addEventListener('visibilitychange', function(){
    if(document.hidden) pushRemote();
  });
  window.addEventListener('online', pushRemote);
}else{
  setSync('error', 'Supabase 라이브러리를 불러오지 못했습니다.');
}
</script>
</body>
</html>
